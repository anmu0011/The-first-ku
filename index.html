<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔞</text></svg>"
    />
    <style>
      body {
        text-align: center;
        background-color: #d9d6d6;
        font-family: "Microsoft YaHei";
      }
      h2 {
        color: #f79d76;
      }
      button {
        background-color: #ff6dbb;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        font-size: 10px;
        cursor: pointer;
      }
      .sexy-mode {
        background-color: #f80285;
        color: #fffeff;
        font-size: 20px;
      }
      #playing-list {
        margin-top: 10px;
        padding: 8px;
        padding-bottom: 20px;
        width: 60%;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
        border: 1px solid #000000;
        border-radius: 10px;
      }
      #add-btn,
      #save-btn {
        padding: 8px 15px;
      }
      #playing-list li {
        text-align: left;
        margin-top: 10px;
      }
      .delete-btn {
        margin-left: 10px;
        background-color: #df0000;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #mode-tags {
        margin-bottom: 8px;
      }
      .mode-tag {
        display: inline-block;
        margin: 0 6px;
        padding: 4px 14px;
        border-radius: 14px;
        background-color: #ffe3f1;
        color: #d63384;
        cursor: pointer;
        user-select: none;
      }
      .mode-tag:hover {
        background-color: #ffc9e4;
      }
    </style>
    <title>来玩点好玩的吧~</title>
  </head>
  <body>
    <div
      id="header-box"
      style="
        height: 100px;
        margin: 0;
        border: 0;
        padding: 0;
        text-align: center;
        background-color: black;
        overflow: hidden;
      "
    >
      <h1>我的第一个网页</h1>
    </div>
    <hr />
    <img src="images/avatar.jpg" alt="可口的豆包" width="200" />
    <h2>可口的豆包</h2>
    <h2>和我互动吧~</h2>

    <!-- 关键词标签：点击进入 Sexy 模式，加新词方法见 JS 末尾注释 -->
    <div id="mode-tags">
      <span class="mode-tag" data-mode="御姐">御姐</span>
      <span class="mode-tag" data-mode="萝莉">萝莉</span>
      <span class="mode-tag" data-mode="正太">正太</span>
    </div>
    <input type="text" id="search-input" placeholder="告诉我想怎么玩" />
    <button id="my-btn">快~来~吧~</button>
    <p id="msg"></p>

    <div id="link-box" style="display: none">
      <a
        href="https://www.bilibili.com/video/BV1GJ411x7h7?t=0.0"
        target="_blank"
        >你要的在这里哦~</a
      >
    </div>

    <div id="playing-list">
      <h2>你的一些play清单</h2>
      <input
        type="text"
        id="playing-input"
        placeholder="告诉我你的那些sese的想法吧~"
      />
      <button id="add-btn" type="button">说吧~</button>
      <button id="save-btn" type="button">保存清单</button>
      <ul id="playing-ul"></ul>
    </div>
    <br />
    <a id="gta-link" href="https://www.bilibili.com/video/BV1GJ411x7h7?t=0.0"
      >GTA6 内测版</a
    >

    <script>
      // ---------- 元素 ----------
      const btn = document.getElementById("my-btn");
      const msg = document.getElementById("msg");
      const searchInput = document.querySelector("#search-input");
      const headerBox = document.querySelector("#header-box");
      const playingListBox = document.querySelector("#playing-list");
      const playingInput = document.querySelector("#playing-input");
      const addBtn = document.querySelector("#add-btn");
      const saveBtn = document.querySelector("#save-btn");
      const ulDom = document.querySelector("#playing-ul");
      const gtaLink = document.querySelector("#gta-link");
      const linkBox = document.querySelector("#link-box");
      const modeTags = document.querySelectorAll(".mode-tag");

      // ---------- 待办清单：数组 todoList 是唯一数据源，增删改数组后重画页面 ----------
      let todoList = [];

      addBtn.addEventListener("click", function () {
        const text = playingInput.value.trim();
        if (text === "") {
          alert("请输入内容哦~");
          return;
        }
        todoList.push({ text: text, completed: false });
        playingInput.value = "";
        saveList();
        renderPlayList();
      });

      function renderPlayList() {
        ulDom.innerHTML = "";
        todoList.forEach(function (item, index) {
          const newli = document.createElement("li");
          newli.textContent = item.text;

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "删除";
          deleteBtn.classList.add("delete-btn");
          deleteBtn.addEventListener("click", function () {
            todoList.splice(index, 1);
            saveList();
            renderPlayList();
          });

          newli.appendChild(deleteBtn);
          ulDom.appendChild(newli);
        });
      }

      function saveList() {
        localStorage.setItem("my-playList", JSON.stringify(todoList));
      }

      // 恢复数据；坏数据自动清掉
      function loadList() {
        try {
          const parsed = JSON.parse(localStorage.getItem("my-playList"));
          todoList = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          localStorage.removeItem("my-playList");
          todoList = [];
        }
        renderPlayList();
      }

      saveBtn.addEventListener("click", function () {
        saveList();
        alert("已保存到浏览器！刷新页面也不会丢~");
      });

      loadList();

      // ---------- 模式切换：currentMode 只有 null(普通) 和 "sexy" 两个值 ----------
      // ★ 加新关键词两步：① MODES 数组加词 ② HTML 里加 <span class="mode-tag" data-mode="新词">新词</span>
      const MODES = ["御姐", "萝莉", "正太"];
      let currentMode = null;

      function enterMode() {
        if (currentMode === "sexy") return;
        currentMode = "sexy";
        document.body.classList.add("sexy-mode");
        headerBox.style.display = "none";
        playingListBox.style.display = "none";
        gtaLink.style.display = "none";
        linkBox.style.display = "block";
        btn.textContent = "厌了腻了点我~";
        msg.textContent = "已进入 Sexy 模式~";
        searchInput.value = "";
      }

      function exitMode() {
        currentMode = null;
        document.body.classList.remove("sexy-mode");
        headerBox.style.display = "";
        playingListBox.style.display = "";
        gtaLink.style.display = "";
        linkBox.style.display = "none";
        btn.textContent = "快~来~吧~";
        msg.textContent = "";
      }

      modeTags.forEach(function (tag) {
        tag.addEventListener("click", enterMode);
      });

      // 模糊匹配：输入与关键词互为子串即命中，返回命中的词或 null
      function matchKeyword(text) {
        const clean = text.replace(/\s+/g, "");
        if (!clean) return null;
        for (let i = 0; i < MODES.length; i++) {
          if (
            clean.indexOf(MODES[i]) !== -1 ||
            MODES[i].indexOf(clean) !== -1
          ) {
            return MODES[i];
          }
        }
        return null;
      }

      // 主按钮：Sexy 模式下当返回键，普通模式下当关键词确认键（空输入不响应）
      btn.addEventListener("click", function () {
        if (currentMode === "sexy") {
          exitMode();
          return;
        }
        if (searchInput.value.trim() === "") {
          return;
        }
        if (matchKeyword(searchInput.value)) {
          enterMode();
        } else {
          alert("这个词我还不会哦~换一个试试~");
        }
      });
    </script>
  </body>
</html>
